openapi: 3.1.0
info:
  title: PACE-UEM Application API
  version: 0.1.0
  description: Versioned contract for the PACE Device Center application core.
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - name: Platform
  - name: Devices
  - name: Audit
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Platform]
      security: []
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /devices:
    get:
      operationId: listDevices
      tags: [Devices]
      x-roles: [uem_admin, asset_manager, support, security_viewer, auditor]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeviceStatus"
      responses:
        "200":
          description: A bounded page of devices.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /devices/{deviceId}:
    get:
      operationId: getDevice
      tags: [Devices]
      x-roles: [uem_admin, asset_manager, support, security_viewer, auditor]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Reconciled device detail.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      x-roles: [uem_admin, auditor]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: action
          in: query
          schema:
            type: string
            maxLength: 120
        - name: actor
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: A bounded page of immutable audit events.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reconciliation-items:
    get:
      operationId: listReconciliationItems
      tags: [Devices]
      x-roles: [uem_admin, asset_manager, support, auditor]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: status
          in: query
          schema:
            enum: [pending, resolved, dismissed]
      responses:
        "200":
          description: A bounded page of device reconciliation work.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconciliationItem"
                  page:
                    $ref: "#/components/schemas/CursorPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reconciliation-items/{reconciliationItemId}/decision:
    post:
      operationId: decideReconciliationItem
      tags: [Devices]
      x-roles: [uem_admin, asset_manager]
      parameters:
        - $ref: "#/components/parameters/ReconciliationItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationDecision"
      responses:
        "200":
          description: The versioned reconciliation decision was accepted.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.invalid/realms/pace/.well-known/openid-configuration
      description: Deployment replaces the documentation URL with the approved issuer.
  headers:
    RequestId:
      description: UUID correlating proxy, API, worker, audit, and integration activity.
      schema:
        type: string
        format: uuid
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReconciliationItemId:
      name: reconciliationItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 1000
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: The request does not satisfy the operation contract.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated actor lacks the required role.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource version or state changed before this decision.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
        retry-after:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status:
          const: alive
        service:
          const: pace-uem-api
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    Readiness:
      type: object
      additionalProperties: false
      required: [status, dependencies, timestamp]
      properties:
        status:
          enum: [ready, degraded]
        dependencies:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                enum: [ready, unavailable]
              checkedAt:
                type: string
                format: date-time
        timestamp:
          type: string
          format: date-time
    DeviceStatus:
      type: string
      enum: [pending, active, inactive, retired, quarantined]
    Device:
      type: object
      additionalProperties: false
      required: [id, deviceUuid, hostname, status, healthStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceUuid:
          type: string
          format: uuid
        assetId:
          type: [string, "null"]
          format: uuid
        hostname:
          type: string
        fqdn:
          type: [string, "null"]
        serial:
          type: [string, "null"]
        systemUuid:
          type: [string, "null"]
          format: uuid
        osName:
          type: [string, "null"]
        osVersion:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/DeviceStatus"
        healthStatus:
          enum: [unknown, healthy, warning, critical]
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - requestId
        - actor
        - action
        - targetType
        - outcome
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
        actor:
          type: string
        actorRole:
          type: [string, "null"]
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: [string, "null"]
        outcome:
          enum: [success, failure, denied]
        sourceIp:
          type: [string, "null"]
          format: ipv4
        before:
          type: [object, "null"]
        after:
          type: [object, "null"]
        metadata:
          type: [object, "null"]
    ReconciliationItem:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - environment
        - sourceExternalId
        - reason
        - candidateDeviceIds
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        environment:
          type: string
        sourceExternalId:
          type: string
        reason:
          enum: [hostname-only, conflicting-high-confidence-signals]
        candidateDeviceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        status:
          enum: [pending, resolved, dismissed]
        decision:
          type: [string, "null"]
          enum: [link_existing, create_new, dismiss, null]
        selectedDeviceId:
          type: [string, "null"]
          format: uuid
        decidedBy:
          type: [string, "null"]
        decisionJustification:
          type: [string, "null"]
        decidedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReconciliationDecision:
      type: object
      additionalProperties: false
      required: [decision, justification, expectedVersion]
      properties:
        decision:
          enum: [link_existing, create_new, dismiss]
        selectedDeviceId:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 10
          maxLength: 2000
        expectedVersion:
          type: integer
          minimum: 1
    CursorPage:
      type: object
      additionalProperties: false
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          format: uuid
