name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soc-agent/dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: soc-agent/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          npm test
          node --experimental-strip-types --test ../../apps/api/tests/*.test.ts
          node --test ../../platform/tests/*.test.mjs
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions \
            ../../apps/api/src/integrations/wazuh/agent-sync.ts \
            ../../apps/api/src/integrations/wazuh/agent-page.ts \
            ../../apps/api/src/integrations/wazuh/pagination.ts \
            ../../apps/api/src/integrations/wazuh/retry-policy.ts \
            ../../apps/api/src/integrations/wazuh/sync-batch.ts \
            ../../apps/api/src/integrations/run-state.ts \
            ../../apps/api/src/identity/authorization.ts \
            ../../apps/api/src/reconciliation/decision.ts \
            ../../apps/api/tests/identity-authorization.test.ts \
            ../../apps/api/tests/integration-run.test.ts \
            ../../apps/api/tests/wazuh-agent-sync.test.ts \
            ../../apps/api/tests/wazuh-agent-page.test.ts \
            ../../apps/api/tests/wazuh-pagination.test.ts \
            ../../apps/api/tests/wazuh-retry-policy.test.ts \
            ../../apps/api/tests/reconciliation-decision.test.ts

      - name: Build
        run: npm run build
        env:
          SOC_ADMIN_PASSWORD: ci-only-password
          SOC_ANALYST_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
          ALLOWED_ORIGIN: http://localhost:3000
